name: reflection_class
description: >-
  Reach an object's properties and methods by name where Flutter has no
  dart:mirrors. Declare the members once, then read, write, call and serialise
  them at run time. No code generation, no dependencies.
version: 1.0.0
homepage: https://github.com/Bomsamdi/reflection_class
repository: https://github.com/Bomsamdi/reflection_class
issue_tracker: https://github.com/Bomsamdi/reflection_class/issues

topics:
  - reflection
  - mirrors
  - serialization
  - metadata

environment:
  sdk: ^3.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
